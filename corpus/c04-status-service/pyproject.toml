[project]
name = "status-service"
version = "2.1.0"
description = "A public status endpoint reporting liveness, published version and process uptime, and nothing else."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
