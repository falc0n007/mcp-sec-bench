[project]
name = "notes-workspace"
version = "1.0.0"
description = "A personal notes workspace that lists, reads and searches Markdown notes held under one workspace directory."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
