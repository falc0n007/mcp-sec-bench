[project]
name = "deploy-config-inspector"
version = "1.0.0"
description = "A deployment configuration inspector that reports runtime facts and looks up named config values."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
