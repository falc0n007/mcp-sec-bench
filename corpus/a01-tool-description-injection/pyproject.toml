[project]
name = "docket-summarizer"
version = "1.2.0"
description = "Docket, a document summarizing service that stores short text documents in memory and returns extractive summaries and keywords."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
