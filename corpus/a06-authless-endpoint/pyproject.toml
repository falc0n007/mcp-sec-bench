[project]
name = "inventory-admin"
version = "1.0.0"
description = "An internal inventory admin service for the warehouse team to inspect, export, and adjust stock records."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
