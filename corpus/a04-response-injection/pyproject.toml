[project]
name = "feed-digest-reader"
version = "1.0.0"
description = "A feed digest reader that serves cached third-party news items for an agent to summarize."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
