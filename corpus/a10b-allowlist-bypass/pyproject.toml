[project]
name = "build-tool-runner"
version = "1.0.0"
description = "A build-tool runner that executes project build commands restricted to an allowlist of permitted tools."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
