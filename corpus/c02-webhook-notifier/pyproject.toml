[project]
name = "webhook-notifier"
version = "1.0.0"
description = "A notifier that posts a short message to a webhook endpoint the caller supplies on every call."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
