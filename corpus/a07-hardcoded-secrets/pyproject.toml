[project]
name = "cloud-cost-reporter"
version = "1.3.0"
description = "A cloud cost reporter that estimates month-to-date spend and attributes it to recent release tags."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp==4.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
