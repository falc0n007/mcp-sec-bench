# Monthly scoreboard re-run (Phase 5), and the only path that publishes one.
#
# PUBLISHING IS GATED. The `deploy` job runs only when the repository variable
# PUBLISH_SCOREBOARD is exactly 'true' (Settings > Secrets and variables >
# Actions > Variables). Leave it unset until the disclosure round in
# docs/disclosure.md has closed: numbers must not become public before the
# vendors have had their window. While the gate is off, this workflow still
# runs the whole pipeline so it is known to work, but it
#   - writes the scoreboard output to a file and never prints it to the log
#     (Actions logs of a public repository are public), and
#   - uploads no artifact (artifacts of a public repository are downloadable
#     by any signed-in GitHub user).
# Only the pass/fail of each step is visible.
#
# THE PUBLISHING RUN TARGETS results/ EXPLICITLY. runner/cli.py defaults --out
# to results/local/, which is gitignored, so that a dev run can never be
# mistaken for a published score (see the Makefile comment above `scoreboard`).
# `make scoreboard` therefore is not what this workflow calls; it invokes the
# runner with `--out results` instead, and renders the site from
# results/results.json. Raw output lands in results/raw/, which governance.md
# commits to publishing; the published-run artifact below carries it so the
# owner can commit it deliberately.
#
# Repository settings the owner must change once:
#   - Settings > Pages > Build and deployment > Source: GitHub Actions
#   - Settings > Environments: `github-pages` (created automatically); add a
#     required reviewer there for a second human gate if wanted.
#   - Variable PUBLISH_SCOREBOARD=true, only when ready to publish.
#   - Optional secret SNYK_TOKEN. Without it the Snyk row is published as
#     unavailable, with the reason, which is the intended behaviour.

name: scoreboard

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Publication gate
        id: gate
        env:
          PUBLISH: ${{ vars.PUBLISH_SCOREBOARD }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "PUBLISH_SCOREBOARD is true: results will be published."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "PUBLISH_SCOREBOARD is not true: dry run, nothing is published or uploaded."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Only export the token if the secret exists. An empty SNYK_TOKEN is
      # not the same as an unset one, and the adapter reports "not set".
      - name: Provide SNYK_TOKEN if configured
        env:
          SNYK_TOKEN_SECRET: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN_SECRET" ]; then
            echo "::add-mask::$SNYK_TOKEN_SECRET"
            echo "SNYK_TOKEN=$SNYK_TOKEN_SECRET" >> "$GITHUB_ENV"
          else
            echo "SNYK_TOKEN not configured; the Snyk row will be unavailable."
          fi

      - name: Set up venv and pinned dependencies
        run: make setup

      - name: Build lab and scanner images
        run: make images

      - name: Bring the lab up
        run: make lab-up

      # Every correctness check, including the lab egress and sinkhole checks.
      - name: Verify
        run: make verify

      # --out results: the explicit publishing target. Output goes to a file,
      # not the log. See the header comment. stderr is captured too: validation
      # failures echo problem text that can carry result values.
      - name: Run the benchmark
        run: |
          .venv/bin/python -m runner.cli --scanners all --runs 5 --detail \
            --out results > "$RUNNER_TEMP/scoreboard.txt" 2>&1

      - name: Build site and badges
        run: |
          .venv/bin/python tools/build_site.py --results results/results.json --out public
          .venv/bin/python tools/badges.py --results results/results.json --out public/badges \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Bring the lab down
        if: always()
        run: make lab-down

      - name: Upload Pages artifact
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # The raw output governance.md says to publish alongside the scoreboard.
      - name: Upload raw results
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: error

  deploy:
    needs: build
    # The gate. Do not remove or loosen without reading the header comment.
    if: needs.build.outputs.publish == 'true' && vars.PUBLISH_SCOREBOARD == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
